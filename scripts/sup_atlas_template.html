<!doctype html>
<html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUP · Modelatlas</title>
<style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#193344;background:#f2f6f7}*{box-sizing:border-box}body{margin:0}header{background:#102e3d;color:white;padding:26px 4vw}h1{margin:0;font-size:30px}header p{color:#c6e2e6;max-width:1000px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,a{cursor:pointer}button,input,select{font:inherit;border:1px solid #b3c9cc;border-radius:6px;padding:9px;background:white;color:#193344}button.active{background:#007c82;color:white}main{padding:24px 4vw}a{color:#006d79}h2{margin-top:0}h3{margin-top:25px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}.card,.panel{background:white;border:1px solid #d5e1e3;border-radius:9px;padding:20px}.card strong{display:block;font-size:32px;color:#007c82}.layout{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:20px}.list{max-height:75vh;overflow:auto}.list a{display:block;padding:9px;border-bottom:1px solid #e3ecee;text-decoration:none}.muted{color:#526e7a;font-size:14px}.badge{display:inline-block;background:#e2f2f1;padding:3px 8px;border-radius:5px;font-size:13px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}input{flex:1;min-width:220px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;text-align:left;border-bottom:1px solid #dce7e9;vertical-align:top}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f7f8;padding:15px;font-size:13px;max-height:550px;overflow:auto}.warning{border-left:4px solid #c58c20;padding:12px;background:#fff5dc}.overflow{overflow:auto}details{margin-top:12px}.source{border-left:3px solid #00858a;padding-left:15px;margin-top:16px}footer{margin-top:25px;color:#526e7a}@media(max-width:800px){.layout{grid-template-columns:1fr}.list{max-height:280px}main{padding:16px}td,th{padding:7px}}
</style>
<header><h1>SUP / Modelatlas</h1><p>Struktur, klinisk betydning og genbrug — grundlag for beslutninger om transition til FHIR. Reference: repositoryets SUP 3.0-skemaer. Kliniske kilder: background_information.</p><nav id="nav"></nav></header><main id="app"></main>
<script id="data" type="application/json">__ATLAS_DATA__</script>
<script>
const D=JSON.parse(document.querySelector('#data').textContent), R=new Map(D.records.map(r=>[r.id,r])), app=document.querySelector('#app');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=r=>`<a href="#item/${encodeURIComponent(r.id)}">${E(r.name)}</a>`;
const source=s=>`<a href="#source/${encodeURIComponent(s.file+':'+s.page)}">${E(s.file)} · kildeside ${s.page}</a>`;
const children=r=>D.records.filter(x=>x.owner===r.id), incoming=r=>D.records.filter(x=>x.target===r.id);
const tabs=[['overview','Overblik'],['catalog','Elementer & attributter'],['reuse','Genbrug'],['types','Datatyper & grupper'],['sources','Kilder'],['transition','Transition'],['method','Metode & kvalitet']];
function shell(tab){document.querySelector('#nav').innerHTML=tabs.map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="location.hash='${id}'">${t}</button>`).join('')}
function table(rows,cols){return `<div class="overflow"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const particle=r=>r.particles.map(p=>`${p.kind} ${p.min}..${p.max} (${p.path})`).join(' → ');
function overview(){const s=D.stats;app.innerHTML=`<h2>Hvor stor er SUP-modellen?</h2><p>En global elementdefinition tælles én gang, uanset hvor ofte den refereres. Lokale deklarationer tælles separat i deres kontekst. Ens navne er ikke i sig selv ens kliniske begreber.</p><div class="cards">${[['globalElements','Globale elementdefinitioner'],['localElements','Lokale elementdeklarationer'],['elementNames','Forskellige elementnavne'],['elementReferences','Elementreferencer'],['attributeDeclarations','Attributdeklarationer'],['attributeNames','Forskellige attributnavne'],['reusedElements','Globale elementer refereret flere gange'],['schemaFiles','Skemafiler']].map(([k,t])=>`<div class="card"><strong>${s[k]}</strong>${t}</div>`).join('')}</div><div class="panel"><h3>Læs modellen fra et indgangspunkt</h3>${D.records.filter(r=>r.global&&r.kind==='element'&&['Patientforloeb','Haendelse','Person','AfleverPatientdata','Notat','Diagnose','Kontaktperiode','Medicinordination','Proeveresultat'].includes(r.name)).map(r=>`<p>${link(r)} <span class="muted">${E(r.file)}</span></p>`).join('')}<p>Alle services, lokale felter og øvrige hændelsestyper findes i kataloget. Åbn et element for at se underfelter, grupper, anvendelser og original XSD.</p></div><p class="warning">Kliniske baggrundskilder er versionsmærkede historiske beskrivelser. Skemaerne afgør den aktuelle struktur. Dokumentationshuller vises eksplicit; atlaset validerer ikke klinisk implementeringsgrad eller en komplet SUP-leveranceprofil.</p>`}
function catalog(kind='catalog') {shell(kind);app.innerHTML=`<h2>${kind==='types'?'Datatyper og genbrugte grupper':'Elementer og attributter'}</h2><div class="tools"><input id="q" placeholder="Søg navn, klinisk tekst eller datatype" aria-label="Søg"><select id="file" aria-label="Skemafil"><option value="">Alle skemafiler</option>${D.schemas.map(s=>`<option>${E(s.file)}</option>`).join('')}</select><select id="kind" aria-label="Deklarationstype"><option value="">Alle typer</option>${(kind==='types'?['simpleType','complexType','attributeGroup','group']:['element','attribute']).map(x=>`<option>${x}</option>`).join('')}</select><select id="scope" aria-label="Omfang"><option value="">Alle kontekster</option><option value="global">Globale definitioner</option><option value="local">Lokale deklarationer</option><option value="refs">Referencer</option><option value="missing">Uden klinisk kilde</option></select></div><div class="panel" id="results"></div>`;function update(){const q=document.querySelector('#q').value.toLowerCase(),f=document.querySelector('#file').value,k=document.querySelector('#kind').value,scope=document.querySelector('#scope').value;const rows=D.records.filter(r=>(kind==='types'?['simpleType','complexType','attributeGroup','group'].includes(r.kind):['element','attribute'].includes(r.kind))&&(!f||r.file===f)&&(!k||r.kind===k)&&(!scope||scope==='global'&&r.global&&!r.ref||scope==='local'&&!r.global&&!r.ref||scope==='refs'&&r.ref||scope==='missing'&&!r.ref&&!r.clinical.length&&!r.annotation)&&JSON.stringify([r.name,r.type,r.annotation,r.clinical]).toLowerCase().includes(q));document.querySelector('#results').innerHTML=`<p>${rows.length} resultater</p>`+table(rows,[['Navn',link],['Type',r=>E(r.kind)+(r.ref?' · reference':'')],['Kontekst',r=>R.has(r.owner)?link(R.get(r.owner)):E(r.file)],['Klinisk kilde',r=>r.clinical.length?'Kildeafsnit':r.annotation?'XSD-annotation':'Ikke fundet']])}['q','file','kind','scope'].forEach(id=>document.getElementById(id).addEventListener('input',update));update()}
function item(id){const r=R.get(id);if(!r){app.innerHTML='<p>Elementet findes ikke.</p>';return}shell('catalog');const target=R.get(r.target),cs=children(r),uses=incoming(r);app.innerHTML=`<div class="layout"><aside class="panel list"><h3>${E(r.file)}</h3>${D.records.filter(x=>x.file===r.file&&x.global).map(link).join('')}</aside><article class="panel"><h2>${E(r.name)}</h2><p><span class="badge">${E(r.kind)}</span> ${r.ref?'Reference':r.global?'Global definition':'Lokal deklaration'} · ${E(r.file)}</p>${R.has(r.owner)?`<p>Indgår i ${link(R.get(r.owner))}</p>`:''}${target?`<p>Definition: ${link(target)}</p>`:''}<p>Datatype: ${r.typeTarget?link(R.get(r.typeTarget)):E(r.type||'—')} ${r.kind==='attribute'?`· brug: ${E(r.use)}`:`· deklareret kardinalitet: ${r.min}..${r.max}`}</p>${particle(r)?`<p class="muted">Omsluttende modelgrupper: ${E(particle(r))}. Ved choice er grenene alternativer; lokal 1..1 betyder ikke, at alle alternativer er obligatoriske.</p>`:''}${r.default!==null?`<p>Default: ${E(r.default)}</p>`:''}${r.fixed!==null?`<p>Fast værdi: ${E(r.fixed)}</p>`:''}<h3>Klinisk betydning</h3>${r.annotation?`<div class="source"><b>XSD-annotation</b><p>${E(r.annotation)}</p></div>`:''}${r.clinical.map(s=>`<div class="source"><b>${source(s)}</b><pre>${E(s.text)}</pre><p class="muted">Historisk baggrundsbeskrivelse; sammenhold med den aktuelle XSD ovenfor.</p></div>`).join('')}${!r.annotation&&!r.clinical.length?`<p class="warning">Ingen direkte klinisk definition er automatisk knyttet til denne deklaration. ${target?'Følg den refererede definition.':'Brug kildesøgningen og den overordnede kontekst; betydning er ikke udledt alene af navnet.'}</p>`:''}<h3>Underfelter og genbrugte grupper</h3>${table(cs,[['Felt',link],['Struktur',x=>E(x.kind)+(x.ref?' → '+(R.has(x.target)?link(R.get(x.target)):E(x.ref)):'' )],['Datatype',x=>x.typeTarget?link(R.get(x.typeTarget)):E(x.type)],['Krav',x=>x.kind==='attribute'?E(x.use):E(x.min+'..'+x.max)],['Modelgruppe',x=>E(particle(x))]])}<h3>Bruges fra (${uses.length} referencesteder)</h3>${table(uses,[['Deklaration',link],['Kontekst',x=>R.has(x.owner)?link(R.get(x.owner)):E(x.file)],['Gruppe',x=>E(particle(x))]])}${r.facets.length?`<h3>Værdibegrænsninger i denne deklaration</h3>${table(r.facets,[['Regel',x=>E(x.kind)],['Værdi',x=>E(x.value)]])}`:''}<details><summary>Original XSD og præcis deklarationssti</summary><p>${E(r.path)}</p><pre>${E(r.xml)}</pre></details></article></div>`}
function reuse(){shell('reuse');const rows=D.records.filter(r=>r.global&&!r.ref&&r.reuse).sort((a,b)=>b.reuse-a.reuse);app.innerHTML=`<h2>Genbrug på tværs af modellen</h2><p>Antal angiver direkte ref-forekomster i de ${D.stats.schemaFiles} forskellige skemafiler, hver læst én gang. Includes tælles ikke som nye definitioner. Indirekte udfoldning til XML-stier er ikke en del af tallet.</p><div class="panel">${table(rows,[['Definition',link],['Art',r=>E(r.kind)],['Referencesteder',r=>r.reuse],['Forskellige ejerdefinitioner',r=>new Set(incoming(r).map(x=>x.owner)).size],['Skemafiler med brug',r=>new Set(incoming(r).map(x=>x.file)).size]])}</div><h3>Samme navn i forskellige kontekster</h3><p>Dette er navnelighed, ikke en påstand om klinisk identitet. Se især Identifikation og tidsfelter.</p>${table(Object.entries(D.records.filter(r=>!r.ref&&['element','attribute'].includes(r.kind)).reduce((a,r)=>{(a[r.kind+':'+r.name]??=[]).push(r);return a},{})).filter(([,v])=>v.length>1),[['Navn',r=>E(r[0])],['Deklarationer',r=>r[1].length],['Kontekster',r=>r[1].map(link).join(' · ')]])}`}
function sources(){shell('sources');app.innerHTML=`<h2>Søg i kliniske baggrundskilder</h2><input id="sq" placeholder="Søg fx dosering, samtykke, ugyldighed eller SOR" aria-label="Søg kilder"><div id="sr" class="panel" style="margin-top:15px"></div>`;const update=()=>{const q=document.querySelector('#sq').value.toLowerCase();const rows=D.pages.filter(p=>!q||p.text.toLowerCase().includes(q));document.querySelector('#sr').innerHTML=`<p>${rows.length} kildesider</p>`+table(rows,[['Kilde',source],['Uddrag',p=>E(p.text.replace(/\s+/g,' ').slice(Math.max(0,p.text.toLowerCase().indexOf(q)-100),Math.max(0,p.text.toLowerCase().indexOf(q)-100)+350))]])};document.querySelector('#sq').oninput=update;update()}
function sourcePage(id){shell('sources');const p=D.pages.find(p=>p.id===id||p.file+':'+p.page===id);app.innerHTML=p?`<div class="panel"><h2>${E(p.file)} · kildeside ${p.page}</h2><p><a href="../background_information/${encodeURIComponent(p.file)}">Åbn hele Markdown-kilden</a></p><pre style="max-height:none">${E(p.text)}</pre><div class="tools">${D.pages.filter(x=>x.file===p.file&&Math.abs(x.page-p.page)===1).map(source).join(' · ')}</div></div>`:'Kildesiden findes ikke.'}
function method(){shell('method');app.innerHTML=`<div class="panel"><h2>Metode, versionsgrundlag og kvalitet</h2><p>Alle XSD-filer i Schema analyseres som en samlet inventarliste. Namespace og includes bevares. Globale definitioner identificeres ved art og navn i SUP-namespace; lokale deklarationer identificeres ved fil og syntaktisk sti. Ref-steder tælles separat. Dette tæller skemadeklarationer, ikke instansdata, kliniske begreber eller FHIR-ressourcer.</p><p>Kliniske koblinger finder klassenavne med normaliseret dansk stavning (æ/ae, ø/oe, å/aa, mellemrum/underscore). Attributter kobles til navngivne feltrækker i den tilhørende klasse. XSD-annotationer vises direkte. Originale afsnit vises med fil og kildeside. Automatisk kobling skal gennemgås fagligt, særligt ved versionsforskelle.</p><p>Kliniske kildekoblinger: ${D.stats.clinicalElements}/${D.stats.elementDeclarations} elementdeklarationer og ${D.stats.clinicalAttributes}/${D.stats.attributeDeclarations} attributdeklarationer. Dækningen måler kildekobling, ikke kvalitet eller klinisk komplethed. Alle dokumenters kildesider er søgbare.</p><p>Grupper kan åbnes og udfoldes via links. Kardinalitet vises lokalt sammen med omsluttende sequence/choice/all. Attributgruppernes felter vises ved at følge gruppen. Der foretages ingen forenkling, som gør alternative grene obligatoriske.</p><h3>Kontrolfund (${D.issues.length})</h3>${table(D.issues,[['Fund',x=>E(x.message)],['Deklaration',x=>R.has(x.id)?link(R.get(x.id)):'—']])}<h3>Maskinlæsbare eksportfiler</h3><p><a href="atlas.json">Komplet JSON</a> · <a href="elements.csv">Elementer CSV</a> · <a href="attributes.csv">Attributter CSV</a> · <a href="summary.json">Opgørelse JSON</a></p><h3>Skemamanifest</h3>${table(D.schemas,[['Fil',s=>E(s.file)],['Namespace',s=>E(s.namespace)],['SHA-256',s=>`<code>${E(s.sha256)}</code>`]])}<h3>Baggrundskilder</h3>${table(D.sources,[['Fil',s=>`<a href="../background_information/${encodeURIComponent(s.file)}">${E(s.file)}</a>`],['SHA-256',s=>`<code>${E(s.sha256)}</code>`]])}</div>`}
function transition(){shell('transition');app.innerHTML=`<div class="panel"><h2>Beslutningsgrundlag for SUP → FHIR</h2><p>Atlaset kortlægger SUP. Tabellen nedenfor er en arbejdsramme for næste analyse; den fastlægger ingen FHIR-version, profiler eller endelig mapping.</p>${table([['Patient, forløb og kontakt','Adskil patientidentitet, hoved-/underforløb, tekniske forløb og kontakt. Identifikationer skal bevare scope og referenceintegritet.'],['Hændelser og journaltekst','Afklar forskellen mellem registreringstid, klinisk tidspunkt og ugyldighed. Bevar fritekst, notatbrødtekst og objektreferencer.'],['Kodning og organisation','Genbrug KodetVaerdi og SammensatKodetVaerdi som analysekerner. Undersøg kodeværk, tillægskoder, SOR/SHAK og enhedernes rolle.'],['Medicin og procedure','Adskil ordination, planlægning og udførelse. Undersøg hvad der kun findes i fritekst og hvilke relationer der er ID-attributter.'],['Resultat og vurdering','Skeln mellem fund, prøveresultat, diagnose, mål og problem. Undersøg datatyper, enheder, fortolkning og klinisk kontekst.'],['Ukendte værdier','SUPdateTime accepterer både dato og tidspunkt samt undef. SUPfloat accepterer undef. Bevar semantikken af _ og $? uden at konvertere dem til normale kliniske værdier.'],['Leverance og livscyklus','Analyser Opdater, OpdaterSpecielt, Slet og SletSpecielt, samtykke og adgang. En feltmapping er ikke tilstrækkelig til at bevare transaktionsadfærd.']], [['Område',r=>E(r[0])],['Beslutning der skal træffes',r=>E(r[1])]])}<h3>Foreslået næste arbejdsgang</h3><ol><li>Fastlæg den operationelle SUP 3.0-leveranceprofil og faktisk anvendelse i afsendersystemerne.</li><li>Gennemgå kildekoblinger og dokumentationshuller med kliniske og tekniske fagpersoner.</li><li>Vælg FHIR-version og danske profiler. Opret mapping pr. element og attribut med krav til transformation, tab og validering.</li><li>Valider mapping på repræsentative forløb, rettelser og sletninger før migrationsbeslutning.</li></ol><p>Brug JSON og CSV som inventar til mappingtabellen; behold deklarations-ID som sporbar nøgle.</p></div>`}
const baseOverview=overview;overview=function(){baseOverview();app.querySelector('h2').insertAdjacentHTML('afterend',`<div class="warning"><b>${D.stats.uniqueGlobalElementNames} unikke globale elementnavne</b> fordelt på ${D.stats.globalElements} globale deklarationer. ${D.stats.globalElementVariantNames} navne har flere servicevarianter. Med lokale elementer er der ${D.stats.elementNames} forskellige elementnavne i alt. Dette er en strukturel opgørelse; antallet af selvstændige kliniske begreber kræver faglig vurdering.</div>`);app.innerHTML=app.innerHTML.replace('Globale elementdefinitioner','Globale elementdeklarationer')};
const baseItem=item;item=function(id){baseItem(id);const r=R.get(id);if(!r)return;const article=app.querySelector('article');if(r.variants?.length)article.querySelector('h2').insertAdjacentHTML('afterend',`<p class="warning">Samme globale navn er også deklareret i andre skemakontekster: ${r.variants.map(x=>link(R.get(x))).join(' · ')}. Disse skal vurderes som servicevarianter.</p>`);if(r.targets?.length>1)article.insertAdjacentHTML('beforeend',`<h3>Mulige referencemål</h3>${r.targets.map(x=>link(R.get(x))).join(' · ')}`);const terms=E(r.name.replaceAll('_',' '));article.insertAdjacentHTML('beforeend',`<details><summary>Klinisk kontekst og supplerende kildefund</summary><p>Kontekst: ${R.has(r.owner)?link(R.get(r.owner)):E(r.file)}. Følg underfelter og referencer ovenfor for rolle, kodning og relationer.</p>${table(D.pages.filter(p=>p.text.toLowerCase().replaceAll('_',' ').includes(r.name.toLowerCase().replaceAll('_',' '))),[['Kildeside',source],['Uddrag',p=>{const text=p.text.replace(/\s+/g,' '),i=text.toLowerCase().indexOf(r.name.toLowerCase().replaceAll('_',' '));return E(text.slice(Math.max(0,i-100),Math.max(0,i-100)+450))}]])}</details>`)};
function render(){const [tab,...rest]=location.hash.slice(1).split('/');const id=decodeURIComponent(rest.join('/'));shell(tab||'overview');if(tab==='item')item(id);else if(tab==='source')sourcePage(id);else if(tab==='catalog'||tab==='types')catalog(tab);else if(tab==='reuse')reuse();else if(tab==='sources')sources();else if(tab==='method')method();else if(tab==='transition')transition();else overview();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
</script></html>
